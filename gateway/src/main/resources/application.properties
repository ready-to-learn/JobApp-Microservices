spring.application.name=gateway
server.port=8085

#Gateway
spring.cloud.gateway.routes[0].id=jobms
spring.cloud.gateway.routes[0].uri=lb://JOBMS
spring.cloud.gateway.routes[0].predicates=Path=/jobs/**

spring.cloud.gateway.routes[1].id=companyms
spring.cloud.gateway.routes[1].uri=lb://COMPANYMS
spring.cloud.gateway.routes[1].predicates=Path=/companies/**

spring.cloud.gateway.routes[2].id=reviewms
spring.cloud.gateway.routes[2].uri=lb://REVIEWMS
spring.cloud.gateway.routes[2].predicates=Path=/reviews/**


# Route to Eureka dashboard through Gateway
spring.cloud.gateway.routes[3].id=eureka
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/eureka/(?<remaining>.*), /${remaining}

# Optional: redirect /eureka to /eureka/ (prevents asset loading issues)
spring.cloud.gateway.routes[4].id=eureka-redirect
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka
spring.cloud.gateway.routes[4].filters[0]=RedirectTo=302, /eureka/



logging.level.root=debug
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

#Config Server
spring.config.import=optional:configserver:http://localhost:8084






